name: CI

# Required status check for the protected `main` branch.
# Runs on every PR and on direct pushes to main.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        # Dummy env values: nothing here needs a real database or a real Resend
        # account. `next build` only pre-renders static pages and type-checks --
        # /dashboard and /dashboard/lists/[id] are dynamic routes that defer their
        # DB access to request time, so a fake DATABASE_URL never gets used here.
        env:
          DATABASE_URL: postgresql://user:pass@ci-placeholder.neon.tech/db?sslmode=require
          AUTH_SECRET: ci-placeholder-secret-not-used-in-production
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM_EMAIL: onboarding@resend.dev
        run: npm run build
